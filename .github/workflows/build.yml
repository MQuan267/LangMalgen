name: Build EXE

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile artifacts/integration/latest_sysinfo_https_exfil.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: exe-output
          path: dist/*.exe
