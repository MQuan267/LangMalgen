name: Build EXE

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller requests urllib3 certifi charset_normalizer idna pywin32

      - name: Build EXE
        run: |
          pyinstaller --onefile `
            --clean `
            --hidden-import=requests `
            --hidden-import=urllib3 `
            --hidden-import=certifi `
            --hidden-import=charset_normalizer `
            --hidden-import=idna `
            --hidden-import=winreg `
            --collect-all requests `
            --collect-all urllib3 `
            --name latest `
            artifacts/latest/latest.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: latest-exe
          path: dist/latest.exe
          retention-days: 7