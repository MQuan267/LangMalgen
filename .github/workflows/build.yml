name: Build EXE

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile ^
            --name latest ^
            artifacts/latest/latest.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: latest-exe
          path: dist/latest.exe
          retention-days: 7